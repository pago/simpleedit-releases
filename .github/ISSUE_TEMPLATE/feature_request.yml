name: Feature request
description: Something you'd like SimpleEdit to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or workflow, and where SimpleEdit gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Your idea of a solution, if you have one.
